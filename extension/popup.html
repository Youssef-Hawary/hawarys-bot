<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hawary's Bot</title>
  <style>
    :root { --bg:#0B0E14; --card:#171B24; --line:rgba(255,255,255,.08); --neon:#38C6F4; --fg:#F2F5F9; --fg2:#AEB7C7; --fg3:#77808F; --ok:#34D399; --warn:#FBBF24; --bad:#F87171; }
    * { box-sizing: border-box; }
    body { margin:0; width:330px; background:radial-gradient(400px 220px at 20% 0%, #10304a, var(--bg) 70%); color:var(--fg); font:14px/1.45 "Cairo","Segoe UI",system-ui,sans-serif; }
    header { display:flex; align-items:center; gap:10px; padding:16px 16px 8px; }
    header img { width:34px; height:34px; filter:drop-shadow(0 0 8px rgba(56,198,244,.6)); }
    h1 { font-size:17px; margin:0; font-weight:900; } h1 span { color:var(--neon); text-shadow:0 0 14px rgba(56,198,244,.6); }
    .sub { color:var(--fg3); font-size:12px; margin-top:-2px; }
    main { padding:8px 16px 16px; display:grid; gap:10px; }
    .card { background:linear-gradient(180deg, rgba(29,34,45,.85), rgba(17,21,28,.85)); border:1px solid var(--line); border-radius:14px; padding:12px; }
    label { display:block; font-size:12px; color:var(--fg2); font-weight:600; margin:0 0 4px; }
    input { width:100%; background:rgba(11,14,20,.7); border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:var(--fg); font:inherit; outline:none; }
    input:focus { border-color:var(--neon); box-shadow:0 0 0 3px rgba(56,198,244,.15); }
    .row { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px; }
    .row b { margin-left:auto; font-weight:700; }
    .dot { width:8px; height:8px; border-radius:99px; flex:none; }
    button { width:100%; border:0; border-radius:11px; padding:9px 12px; font:700 14px "Cairo",system-ui; cursor:pointer; }
    .primary { background:linear-gradient(#7FE3FF,#38C6F4); color:#06232F; }
    .soft { background:rgba(255,255,255,.07); color:var(--fg); }
    .danger { background:rgba(248,113,113,.15); color:var(--bad); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .err { color:var(--bad); font-size:12px; }
    .hint { color:var(--fg3); font-size:12px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icons/128.png" alt="" />
    <div><h1>Hawary's <span>Bot</span></h1><div class="sub" id="who">Not connected</div></div>
  </header>
  <main>
    <form id="login" class="card hidden" style="display:grid;gap:10px">
      <div><label for="server">Dashboard address</label><input id="server" placeholder="https://bot.hawarystore.com" required /></div>
      <div><label for="user">Username</label><input id="user" autocomplete="username" required /></div>
      <div><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required /></div>
      <div class="err" id="loginErr"></div>
      <button class="primary" type="submit">Connect</button>
    </form>

    <section id="panel" class="hidden" style="display:grid;gap:10px">
      <div class="card">
        <div class="row"><span class="dot" id="dConn"></span>Dashboard<b id="tConn">…</b></div>
        <div class="row"><span class="dot" id="dBot"></span>Bot<b id="tBot">…</b></div>
        <div class="row"><span class="dot" id="dTab"></span>Eldorado tab<b id="tTab">…</b></div>
        <div class="row"><span class="dot" id="dRole"></span>This browser<b id="tRole">…</b></div>
        <div class="row"><span class="dot" id="dRec"></span>Recorder<b id="tRec">…</b></div>
      </div>
      <div class="card hint" id="info"></div>
      <div class="grid2">
        <button class="soft" id="open">Open dashboard</button>
        <button class="primary" id="toggle">Start bot</button>
      </div>
      <button class="soft" id="eld">Open Eldorado</button>
      <button class="soft" id="keys">Connect Eldorado API (owner)</button>
      <div class="hint" id="keysMsg"></div>
      <button class="danger" id="logout">Disconnect</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
